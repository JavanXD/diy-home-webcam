<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Webcam">
  <defs>
    <clipPath id="tile">
      <rect x="2" y="2" width="60" height="60" rx="14"/>
    </clipPath>
  </defs>
  <!-- Tile + scene -->
  <g clip-path="url(#tile)">
    <rect x="2" y="2" width="60" height="60" fill="#1a1f24"/>
    <rect x="2" y="2" width="60" height="32" fill="#2a3238"/>
    <rect x="2" y="32" width="60" height="30" fill="#0f3d24"/>
    <rect x="2" y="32" width="60" height="3" fill="#1b7a45"/>
  </g>
  <!-- Camera body (cream) -->
  <rect x="11" y="26" width="42" height="26" rx="6" fill="#f7f3ec"/>
  <!-- Lens: brand gold → dark well → cam-green iris → pupil -->
  <circle cx="37" cy="39" r="11" fill="#c4a574"/>
  <circle cx="37" cy="39" r="7.5" fill="#1a1f24"/>
  <circle cx="37" cy="39" r="4.5" fill="#1b7a45"/>
  <circle cx="37" cy="39" r="2" fill="#0f3d24"/>
  <circle cx="34" cy="36" r="1.5" fill="#ffffff" fill-opacity="0.9"/>
</svg>
