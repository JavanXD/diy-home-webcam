# Lovelace — single uncensored live view via go2rtc + webrtc-camera.
#
# Prerequisites:
#   1. Pi Extra running: webcam-stream on :8081 (sudo ./pi/provision.sh)
#   2. Streams in go2rtc — see go2rtc.yaml
#        webcam_example_live       H264 (ffmpeg) for mode: webrtc
#        webcam_example_live_snap  JPEG still for the card poster
#   3. HACS / custom card: AlexxIT/WebRTC (custom:webrtc-camera)
#   4. Restart go2rtc after changing streams
#
# Tokens:
#   webcam_example_live / webcam_example_live_snap   go2rtc streams: keys
#   Example Webcam Live                              display name on the card
#
# Poster (HTTPS Home Assistant dashboards):
#   Use a go2rtc stream *name* as poster. AlexxIT webrtc-camera loads it via
#   the HA/go2rtc integration (same origin as the dashboard).
#   Do NOT set poster to http://<pi>:8081/snapshot.jpg — browsers block that
#   as mixed content when the dashboard is HTTPS (black poster; curl on LAN
#   still works). Do NOT publish the uncensored Extra still to a public HTTPS
#   host / R2 / Worker.
#   Raw http://<ha-host>:1984/api/frame.jpeg?src=… is also mixed content under
#   HTTPS — use the stream name, not a LAN :1984 URL.
#
# Video only / muted is fine — the Pi Extra has no audio.
#
# Fallback without transcode: set mode: mjpeg (MJPEG works as JPEG). Prefer
# the ffmpeg H264 path in go2rtc.yaml so mode: webrtc matches other cams.

type: custom:webrtc-camera
streams:
  - url: webcam_example_live
    mode: webrtc
    media: video
    name: Example Webcam Live
ui: true
background: true
muted: true
poster: webcam_example_live_snap
style: >-
  .mode {} .fullscreen {display: none} .screenshot {display: none}
  .pictureinpicture {display: none} video {aspect-ratio: 16/9; object-fit:
  fill;}
