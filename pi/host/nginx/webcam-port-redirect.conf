# HTTP → camera appliance (:8080). Installed by pi/scripts/apply-http-redirect.sh
# Display name / hostname come from your camera.yaml / host config
# Favicon: no HTML here — ``return 301 …$request_uri`` so /favicon.* follows to :8080.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name home-webcam.local raspicam _;

    return 301 http://$host:8080$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name home-webcam.local raspicam _;

    ssl_certificate     /etc/nginx/ssl/raspicam-local.crt;
    ssl_certificate_key /etc/nginx/ssl/raspicam-local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 http://$host:8080$request_uri;
}
