name: CI

on:
  push:
    paths:
      - "pi/**"
      - "scripts/**"
      - "cameras/**"
      - "shared/**"
      - "image/**"
      - "webhosting/package.json"
      - "webhosting/package-lock.json"
      - ".github/workflows/**"
      - ".github/gitleaks.toml"
      - ".bandit"
      - ".shellcheckrc"
      - "SECURITY.md"
      - "docs/diy/SECURITY.md"
  pull_request:
    paths:
      - "pi/**"
      - "scripts/**"
      - "cameras/**"
      - "shared/**"
      - "image/**"
      - "webhosting/package.json"
      - "webhosting/package-lock.json"
      - ".github/workflows/**"
      - ".github/gitleaks.toml"
      - ".bandit"
      - ".shellcheckrc"
      - "SECURITY.md"
      - "docs/diy/SECURITY.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  camera:
    name: Pi camera tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: pi/camera
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt pytest pillow
          .venv/bin/pytest -q

  pipeline:
    name: Pi pipeline + timelapse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Seed cameras/example from examples (no private/ on CI)
        run: |
          # Ops tree keeps Example under gitignored private/ + symlink.
          # CI has neither — materialize a example-shaped copy from examples.
          if [[ ! -f cameras/example/camera.yaml ]]; then
            mkdir -p cameras
            rm -rf cameras/example
            cp -R examples/cameras/example cameras/example
            python3 - <<'PY'
          from pathlib import Path
          root = Path("cameras/example")
          for path in [root / "camera.yaml", *sorted((root / "variants").glob("*.yaml"))]:
              text = path.read_text(encoding="utf-8")
              text = text.replace("Example Webcam", "Example Webcam")
              text = text.replace("example", "example")
              path.write_text(text, encoding="utf-8")
          cam = root / "camera.yaml"
          body = cam.read_text(encoding="utf-8")
          if "status_text:" not in body:
              body = body.rstrip() + "\n\nstatus_text:\n  night_title: Nachts offline\n  maintenance_title: Wartung\n  back_at_label: Wieder da ab\n"
              cam.write_text(body, encoding="utf-8")
          print("seeded", root)
          PY
          fi
          test -f cameras/example/variants/landscape-public.yaml
          test -f cameras/example/variants/private.yaml
      - name: Pipeline tests
        working-directory: pi/pipeline
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt pytest pillow
          .venv/bin/pytest -q
      - name: Timelapse script smoke
        run: |
          python -m pip install -q pillow
          mkdir -p /tmp/tl-in /tmp/tl-out
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          d = Path("/tmp/tl-in")
          for i in range(3):
              Image.new("RGB", (64, 48), (i * 40, 80, 120)).save(d / f"{i:02d}.jpg", quality=80)
          PY
          python scripts/make-timelapse.py -i /tmp/tl-in -o /tmp/tl-out/t.gif --delay-ms 100
          test -s /tmp/tl-out/t.gif

  security:
    name: Security scanners
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks + actionlint + shellcheck
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv -f ./actionlint /usr/local/bin/actionlint
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Gitleaks (secrets)
        run: gitleaks detect --source . --redact --config .github/gitleaks.toml

      - name: Actionlint (workflow YAML)
        run: actionlint -color

      - name: ShellCheck
        run: |
          set -euo pipefail
          find image pi/scripts pi/camera/scripts pi/pipeline/scripts scripts \
            -type f -name '*.sh' -print0 \
            | xargs -0 -r shellcheck -S warning
          shellcheck -S warning pi/provision.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bandit (Python SAST)
        run: |
          python -m pip install -q "bandit[toml]>=1.7"
          bandit -r pi/camera/app pi/pipeline/app shared scripts \
            -c .bandit \
            -ll \
            -f txt

      - name: pip-audit (Python deps)
        run: |
          python -m pip install -q pip-audit
          pip-audit -r pi/camera/requirements.txt
          pip-audit -r pi/pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webhosting/package-lock.json

      - name: npm audit (webhosting)
        working-directory: webhosting
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
